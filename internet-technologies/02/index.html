<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Заголовок</title>
</head>
<body>
  <label for="list">Введите число:</label>
  <input id="list" type="number">
  <button id="add">Добавить</button>
  <button id="del">Удалить последнее</button>
  <button id="reset">Очистить</button>
  <p> Массив чисел: <span id="vct"></span></p>
  <p> Количество: <span id="cnt"></span></p>
  <p> Сумма: <span id="sum"></span></p>
  <p> Среднее: <span id="mid"></span></p>
  <p> Максимум: <span id="max"></span></p>
  <p> Минимум: <span id="min"></span></p>
</body>
</html>

<script src="app.js"></script>
