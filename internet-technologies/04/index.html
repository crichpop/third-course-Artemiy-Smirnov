<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Публикации</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Публикации</h1>
<button id="load">Загрузить</button>
<p id="status"></p>
<form id="form">
    <input id="title" placeholder="Заголовок">
    <br>
    <textarea id="body" placeholder="Текст"></textarea>
    <br>
    <button id="save" type="submit">Сохранить</button>
    <button id="cancel" type="button">Отмена</button>
</form>
<input id="search" placeholder="Поиск">
<div id="posts"></div>
<script src="app.js"></script>
</body>
</html>
