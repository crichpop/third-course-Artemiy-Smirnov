<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заполнение областей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Заполнение областей</h1>
<select id="shape">
    <option value="concave">Невыпуклый многоугольник</option>
    <option value="rectangle">Прямоугольник</option>
    <option value="triangle">Треугольник</option>
    <option value="convex">Выпуклый пятиугольник</option>
    <option value="open">Контур с разрывом</option>
</select>
<button id="scanline">Scanline Fill</button>
<button id="clear">Очистить</button>
<button id="compare">Сравнить</button>
<p id="message"></p>
<canvas id="canvas" width="400" height="300"></canvas>
<p>Шаги Flood Fill: <input id="step" type="range" min="0" max="0" value="0"> <span id="step-text">0</span></p>
<p>Строка y: <input id="row" type="number" min="0" max="29" value="12"></p>
<table border="1">
    <tr><th>y</th><th>Пересечения X</th><th>Интервалы</th></tr>
    <tr><td id="row-y"></td><td id="row-xs"></td><td id="row-intervals"></td></tr>
</table>
<table border="1">
    <thead><tr><th>Метод</th><th>Пикселей</th><th>Шагов</th><th>Время 5 серий, мс</th></tr></thead>
    <tbody id="results"></tbody>
</table>
<script src="app.js"></script>
</body>
</html>
